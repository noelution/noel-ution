<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noel:ution — Digital Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-neutral-900 font-sans antialiased">
    <!-- Header -->
    <header class="border-b border-neutral-100 py-6 px-8 flex justify-between items-center max-w-6xl mx-auto">
        <div class="font-bold text-xl tracking-tight">noel<span class="text-neutral-400">:</span>ution</div>
        <nav class="space-x-6 text-sm font-medium text-neutral-600">
            <a href="#work" class="hover:text-black">Work</a>
            <a href="#about" class="hover:text-black">About</a>
            <a href="#contact" class="text-black font-semibold">Contact</a>
        </nav>
    </header>

    <!-- Hero -->
    <section class="py-24 px-8 max-w-6xl mx-auto text-center">
        <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-6">Modern web design for hotels, beach bars & local brands.</h1>
        <p class="text-lg text-neutral-600 max-w-2xl mx-auto mb-10">We build high-performance, responsive websites that convert visitors into customers.</p>
        <a href="#contact" class="px-8 py-4 bg-black text-white font-medium rounded-full hover:bg-neutral-800 transition-colors">Start a Project</a>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-20 px-8 max-w-xl mx-auto border-t border-neutral-100">
        <h2 class="text-2xl font-bold mb-8 text-center">Get in Touch</h2>
        <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
            <input type="hidden" name="access_key" value="94bd55eb-cdc2-48e7-adf9-3c29fb0950a8">
            <div>
                <label class="block text-sm font-medium text-neutral-700 mb-1">Name</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-neutral-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-neutral-700 mb-1">Message</label>
                <textarea name="message" rows="4" required class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-black focus:outline-none"></textarea>
            </div>
            <button type="submit" class="w-full py-3 bg-black text-white font-medium rounded-lg hover:bg-neutral-800 transition-colors">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="border-t border-neutral-100 py-8 px-8 max-w-6xl mx-auto text-center text-sm text-neutral-500 flex justify-between items-center">
        <div>&copy; 2026 noel:ution. All rights reserved.</div>
        <div class="space-x-4">
            <a href="https://instagram.com/" target="_blank" class="hover:text-black">Instagram</a>
            <a href="https://github.com/noelution" target="_blank" class="hover:text-black">GitHub</a>
        </div>
    </footer>
</body>
</html>
